  <line x1="700" y1="422" x2="1290" y2="422" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="1290" y1="422" x2="1290" y2="420" stroke="#333" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
