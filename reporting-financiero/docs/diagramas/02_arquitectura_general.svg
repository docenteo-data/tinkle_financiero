  <text x="700" y="580" font-size="9" text-anchor="middle" fill="#8a2050">conectado a Financial Model</text>

  <line x1="800" y1="550" x2="838" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="819" y="541" font-size="9" text-anchor="middle" fill="#555">writeback</text>

  <rect x="840" y="505" width="200" height="90" rx="6" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
  <text x="940" y="528" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2529">CPM (SQL Database)</text>
