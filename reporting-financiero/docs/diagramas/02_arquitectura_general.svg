  <rect x="875" y="245" width="230" height="40" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="990" y="263" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7a0d0d">UDF Generar_txt</text>
  <text x="990" y="278" font-size="9.5" text-anchor="middle" fill="#8a2020">endpoint público · API REST</text>

  <line x1="990" y1="285" x2="990" y2="305" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="875" y="308" width="230" height="40" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="990" y="326" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#3c0a5c">Pipeline Grabar salidas</text>
  <text x="990" y="341" font-size="9.5" text-anchor="middle" fill="#4a1070">Notebook → Copy a SharePoint</text>

  <text x="990" y="368" font-size="10" text-anchor="middle" fill="#8e24aa">detalle de actividades en</text>
  <text x="990" y="382" font-size="10" text-anchor="middle" fill="#8e24aa">03_orquestacion_pipelines.svg</text>

